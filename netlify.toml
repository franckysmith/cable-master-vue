# Déploiement Netlify (HTTPS automatique) — requis pour tester les notifications push iOS.
[build]
  # Installation propre : contourne le bug npm des binaires natifs optionnels
  # (rolldown/Vite 8) où `npm ci` cross-plateforme ne pose pas le binaire Linux
  # → "Cannot find module rolldown-binding.linux-x64-gnu.node". On repart d'une
  # résolution fraîche côté Netlify. Le lockfile du repo reste inchangé (dev local).
  command = "rm -rf node_modules package-lock.json && npm install && npm run build"
  publish = "dist"

  # Pousser sur GitHub NE DÉPLOIE PAS. Une commande `ignore` qui se termine par
  # 0 dit à Netlify « rien à reconstruire » : le build automatique déclenché par
  # un push est annulé et la version en ligne reste celle publiée volontairement.
  # Mise en ligne explicite depuis le poste :
  #     npm run build && netlify deploy --prod --dir=dist
  # Pour revenir au déploiement automatique : supprimer cette ligne.
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "20"

# SPA (vue-router en mode history) : toutes les routes → index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
