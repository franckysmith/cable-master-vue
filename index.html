<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>cable-master-vue</title>
    <script>
      // Appliquer le dark mode immédiatement pour éviter le flash blanc
      try {
        var s = JSON.parse(localStorage.getItem('cablemaster-settings') || '{}')
        if (s.darkMode !== false) document.documentElement.classList.add('dark')
      } catch(e) { document.documentElement.classList.add('dark') }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
