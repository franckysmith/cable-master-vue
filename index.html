<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Barre système : mauve quasi noir en thème sombre, mauve lumineux en clair -->
    <meta name="theme-color" content="#160a26" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#6a48c9" media="(prefers-color-scheme: light)" />
    <!-- Plein écran depuis l'écran d'accueil (pas la barre Safari avec ✕ / aA) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cinod-Prep" />
    <title>Cinod-Prep</title>
    <script>
      // Appliquer le dark mode immédiatement pour éviter le flash blanc
      try {
        var s = JSON.parse(localStorage.getItem('cablemaster-settings') || '{}')
        if (s.darkMode !== false) document.documentElement.classList.add('dark')
      } catch(e) { document.documentElement.classList.add('dark') }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
